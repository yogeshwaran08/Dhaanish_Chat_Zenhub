server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Upload ceiling. nginx defaults to just 1 MB, which 413s any real video/PDF
  # long before it reaches the backend — the Media Library route itself accepts
  # up to 50 MB (backend/src/routes/mediaLibrary.js), so keep the two in sync.
  # NOTE: if a host-level nginx/proxy also fronts this container, it needs the
  # same directive — the smallest limit in the chain is the one that applies.
  client_max_body_size 50m;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # SSE endpoint — must stream, not buffer; long-lived connections.
  location = /api/events {
    proxy_pass http://forgecrm-backend:3011/api/events;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    chunked_transfer_encoding on;
  }

  location /api {
    proxy_pass http://forgecrm-backend:3011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # A media upload is forwarded on to Meta before the backend answers, which
    # can outlast nginx's 60s default and surface as a 504 mid-upload.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /uploads {
    proxy_pass http://forgecrm-backend:3011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /l/ {
    proxy_pass http://forgecrm-backend:3011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

services:
  caddy:
    image: caddy:2-alpine
    container_name: forgecrm-caddy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - forgecrm

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_HOST: forgecrm-backend
        BACKEND_PORT: 3011
    container_name: forgecrm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    networks:
      - forgecrm

  backend:
    build:
      context: ./backend
    container_name: forgecrm-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # The boot-time migration runner needs the .sql files on disk. They can't
      # be baked into the image (the build context is ./backend, and db/ sits
      # above it), so they're bind-mounted below. Without this the runner logs
      # "migrations directory not found — skipping" and boots against an
      # un-migrated schema, which surfaces later as `column ... does not exist`.
      MIGRATIONS_DIR: /app/db/migrations
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
      - backend_media:/app/media
      - ./db/migrations:/app/db/migrations:ro
    networks:
      - forgecrm

  postgres:
    image: postgres:16-alpine
    container_name: forgecrm-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/migrations:ro
    networks:
      - forgecrm

  redis:
    image: redis:7-alpine
    container_name: forgecrm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - forgecrm

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_media:

networks:
  forgecrm:
    driver: bridge
